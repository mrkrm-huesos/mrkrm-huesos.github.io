<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер до 04.06.2027</title>
</head>
<body>

<h3>скоро тут будет больше инфы</h3>
<h3>домен сгниёт через: <span id="timer">-- дн -- ч -- мин -- сек</span></h3>

<script>
    const target = new Date(2027, 5, 4, 0, 0, 0);

    function updateTimer() {
        const now = new Date();
        const diff = target - now;

        if (diff <= 0) {
            document.getElementById('timer').innerHTML = '0 дн 0 ч 0 мин 0 сек (сгнил)';
            return;
        }

        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        document.getElementById('timer').innerHTML = 
            days + ' дн ' + 
            hours + ' ч ' + 
            minutes + ' мин ' + 
            seconds + ' сек';
    }

    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
