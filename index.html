<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MozzyStudios</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Segoe UI,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top left,#4f46e5,#0f172a 40%),
        radial-gradient(circle at bottom right,#06b6d4,#0f172a 40%);
    color:white;
    overflow:hidden;
}

.card{
    width:min(650px,90%);
    padding:40px;
    border-radius:28px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 8px 32px rgba(0,0,0,.3);
}

.logo{
    font-size:3rem;
    font-weight:700;
    letter-spacing:-2px;
    margin-bottom:8px;
}

.subtitle{
    color:rgba(255,255,255,.65);
    margin-bottom:32px;
}

.section{
    padding:18px;
    border-radius:16px;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
}

.section h2{
    font-size:1rem;
    margin-bottom:10px;
}

.section p{
    color:rgba(255,255,255,.75);
    line-height:1.6;
}

.links{
    margin-top:24px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.links a{
    text-decoration:none;
    color:white;

    padding:10px 18px;
    border-radius:12px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);

    transition:.2s;
}

.links a:hover{
    background:rgba(255,255,255,.15);
    transform:translateY(-2px);
}
</style>
</head>
<body>

<div class="card">

    <div class="logo">MozzyStudios</div>

    <div class="subtitle">
        кайф
    </div>

    <div class="section">
        <h2>О нас</h2>

        <p>
            небольшая студия, создающая игры, инструменты,
            эксперименты и прочие странные штуки.
        </p>
    </div>

    <div class="links">
        <a href="https://github.com/MozzyStudios">GitHub</a>
        <a href="#">Telegram</a>
        <a href="/projects">Projects</a>
    </div>

</div>

</body>
</html>
